<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="英会話フレーズ">
<meta name="theme-color" content="#1F4E79">
<title>英会話フレーズ 470</title>
<style>
  :root{
    --navy:#1F4E79; --navy-deep:#15375B; --gold:#E0A23B; --gold-soft:#FBF1DC;
    --ink:#1B2733; --muted:#5B6B7C; --paper:#F4F6FA; --card:#FFFFFF;
    --line:#E3E9F0; --line-soft:#EEF2F7; --shade:#F6F8FB;
    --font-display:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Hiragino Maru Gothic Pro","Hiragino Sans",system-ui,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,system-ui,"Hiragino Sans","Helvetica Neue",sans-serif;
    --nav-h:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body); background:var(--paper); color:var(--ink);
    font-size:17px; line-height:1.5; -webkit-text-size-adjust:100%;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto;}

  /* header */
  header{
    position:sticky; top:0; z-index:30;
    background:linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);
    color:#fff; padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;
    box-shadow:0 2px 10px rgba(21,55,91,.18);
  }
  header .hwrap{max-width:560px;margin:0 auto;display:flex;align-items:baseline;gap:10px;}
  header h1{font-family:var(--font-display);font-size:21px;font-weight:700;margin:0;letter-spacing:.02em;}
  header .star{color:var(--gold);}
  header .sub{font-size:12px;color:#C8D8EA;margin-left:auto;font-variant-numeric:tabular-nums;}

  main{padding:16px 14px 8px;}

  /* tip banner */
  .tip{
    background:var(--gold-soft); border:1px solid #F0DFB6; border-radius:14px;
    padding:12px 14px; font-size:13.5px; color:#7A5A1E; margin-bottom:14px;
    display:flex; gap:10px; align-items:flex-start; line-height:1.55;
  }
  .tip b{color:#5E4413;}
  .tip .x{margin-left:auto;flex:none;border:none;background:none;color:#9A7B3A;font-size:18px;padding:0 2px;cursor:pointer;}

  /* search */
  .search{position:relative;margin-bottom:12px;}
  .search input{
    width:100%; font-family:var(--font-body); font-size:16px; color:var(--ink);
    padding:13px 14px 13px 42px; border:1.5px solid var(--line); border-radius:13px;
    background:var(--card); outline:none;
  }
  .search input:focus{border-color:var(--navy);}
  .search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:17px;}
  .search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--muted);font-size:20px;padding:6px;display:none;}

  /* chips */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; font-family:var(--font-display); font-size:14px; font-weight:600;
    padding:9px 14px; border-radius:999px; border:1.5px solid var(--line);
    background:var(--card); color:var(--muted); white-space:nowrap; cursor:pointer;
  }
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff;}
  .subchips{display:flex;gap:7px;overflow-x:auto;padding:0 2px 12px;scrollbar-width:none;}
  .subchips::-webkit-scrollbar{display:none;}
  .subchip{
    flex:none;font-size:13px;padding:7px 12px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap;cursor:pointer;
  }
  .subchip.on{background:var(--gold-soft);border-color:var(--gold);color:#7A5A1E;font-weight:600;}

  .count{font-size:12.5px;color:var(--muted);margin:2px 4px 10px;}

  /* cards */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:15px;
    padding:14px 14px 12px; margin-bottom:11px; box-shadow:0 1px 2px rgba(27,39,51,.04);
  }
  .card .en{font-size:19px;font-weight:600;color:var(--navy-deep);line-height:1.35;letter-spacing:.01em;}
  .card .ja{font-family:var(--font-display);font-size:16px;color:var(--ink);margin-top:5px;}
  .card .tag{font-size:11px;color:var(--muted);margin-top:8px;}
  .card .row{display:flex;gap:10px;margin-top:11px;}
  .btn-ic{
    flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    font-family:var(--font-display);font-size:14px;font-weight:600;
    padding:10px;border-radius:11px;border:1.5px solid var(--line);background:var(--shade);color:var(--navy);cursor:pointer;
  }
  .btn-ic:active{background:#EAF0F7;}
  .btn-ic.fav.on{background:var(--gold-soft);border-color:var(--gold);color:#996A18;}
  .btn-ic .em{font-size:16px;}
  .speaking{box-shadow:0 0 0 2px var(--navy) inset;}

  .empty{text-align:center;color:var(--muted);padding:60px 24px;font-size:15px;line-height:1.7;}
  .empty .big{font-size:34px;display:block;margin-bottom:10px;}

  /* study */
  .study-bar{display:flex;gap:8px;margin-bottom:14px;}
  .seg{display:flex;flex:1;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);}
  .seg button{flex:1;border:none;background:none;font-family:var(--font-display);font-weight:600;font-size:13.5px;color:var(--muted);padding:10px 4px;cursor:pointer;}
  .seg button.on{background:var(--navy);color:#fff;}
  .study-scope{margin-bottom:12px;}
  .study-scope select{
    width:100%;font-family:var(--font-body);font-size:15px;color:var(--ink);
    padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);
    -webkit-appearance:none;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%235B6B7C' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;
  }
  .flash{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:28px 22px;box-shadow:0 3px 14px rgba(27,39,51,.06);cursor:pointer;position:relative;
  }
  .flash .qlabel{position:absolute;top:14px;left:0;right:0;font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;}
  .flash .front{font-size:25px;font-weight:600;color:var(--navy-deep);line-height:1.35;}
  .flash .front.ja{font-family:var(--font-display);}
  .flash .divider{width:46px;height:2px;background:var(--gold);border-radius:2px;margin:16px 0;opacity:0;transition:opacity .2s;}
  .flash.revealed .divider{opacity:1;}
  .flash .back{font-size:20px;color:var(--ink);min-height:26px;opacity:0;transition:opacity .25s;}
  .flash .back.ja{font-family:var(--font-display);}
  .flash.revealed .back{opacity:1;}
  .flash .hint{position:absolute;bottom:14px;left:0;right:0;font-size:12px;color:#9AA8B6;}
  .flash.revealed .hint{opacity:0;}
  .flash.no-card{cursor:default;}
  .flash.no-card .divider,.flash.no-card .hint{display:none;}
  .study-ctrl{display:flex;gap:10px;margin-top:14px;align-items:center;}
  .study-ctrl button{
    font-family:var(--font-display);font-weight:600;font-size:15px;border-radius:13px;border:1.5px solid var(--line);
    background:var(--card);color:var(--navy);padding:13px 0;cursor:pointer;
  }
  .study-ctrl .nav{flex:1;}
  .study-ctrl .nav:active{background:#EAF0F7;}
  .study-ctrl .ico{width:52px;flex:none;font-size:18px;}
  .study-ctrl .speak{background:var(--navy);color:#fff;border-color:var(--navy);width:60px;flex:none;font-size:20px;}
  .progress{height:6px;background:var(--line-soft);border-radius:6px;overflow:hidden;margin:14px 2px 4px;}
  .progress span{display:block;height:100%;background:var(--gold);transition:width .25s;}
  .pcount{text-align:center;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:8px;}

  /* bottom nav */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(255,255,255,.96);backdrop-filter:saturate(160%) blur(10px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
    display:flex;
  }
  nav .nwrap{max-width:560px;margin:0 auto;display:flex;width:100%;}
  nav button{
    flex:1;border:none;background:none;height:var(--nav-h);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--muted);font-family:var(--font-display);font-size:11px;font-weight:600;cursor:pointer;
  }
  nav button .nem{font-size:21px;line-height:1;}
  nav button.on{color:var(--navy);}
  .hidden{display:none !important;}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <h1><span class="star">★</span> 英会話フレーズ</h1>
    <span class="sub" id="hcount"></span>
  </div>
</header>

<main class="wrap">
  <!-- ============ 一覧 ============ -->
  <section id="view-browse">
    <div class="tip" id="tip">
      <span>📲</span>
      <div><b>ホーム画面に追加</b>すると全画面のアプリになります。Safariの共有ボタン →「ホーム画面に追加」。</div>
      <button class="x" id="tipX" aria-label="閉じる">×</button>
    </div>
    <div class="search">
      <span class="ic">🔍</span>
      <input id="q" type="search" inputmode="search" placeholder="英語・日本語で検索" autocomplete="off">
      <button class="clr" id="qClr" aria-label="消去">×</button>
    </div>
    <div class="chips" id="majorChips"></div>
    <div class="subchips" id="subChips"></div>
    <div class="count" id="browseCount"></div>
    <div id="list"></div>
  </section>

  <!-- ============ 暗記 ============ -->
  <section id="view-study" class="hidden">
    <div class="study-bar">
      <div class="seg" id="dirSeg">
        <button data-dir="en" class="on">英語 → 日本語</button>
        <button data-dir="ja">日本語 → 英語</button>
      </div>
    </div>
    <div class="study-scope">
      <select id="scopeSel"></select>
    </div>
    <div class="study-ctrl" style="margin-top:0;margin-bottom:14px;">
      <button class="nav" id="shuffleBtn">🔀 シャッフル</button>
    </div>
    <div class="flash" id="flash">
      <div class="qlabel" id="qlabel"></div>
      <div class="front" id="cardFront"></div>
      <div class="divider"></div>
      <div class="back" id="cardBack"></div>
      <div class="hint" id="flashHint">タップで答えを表示</div>
    </div>
    <div class="study-ctrl">
      <button class="ico" id="prevBtn" aria-label="前へ">‹</button>
      <button class="speak" id="studySpeak" aria-label="発音">🔊</button>
      <button class="ico" id="nextBtn" aria-label="次へ">›</button>
    </div>
    <div class="progress"><span id="pbar"></span></div>
    <div class="pcount" id="pcount"></div>
  </section>

  <!-- ============ お気に入り ============ -->
  <section id="view-fav" class="hidden">
    <div class="count" id="favCount"></div>
    <div id="favList"></div>
  </section>
</main>

<nav>
  <div class="nwrap">
    <button data-tab="browse" class="on"><span class="nem">📖</span>一覧</button>
    <button data-tab="study"><span class="nem">🧠</span>暗記</button>
    <button data-tab="fav"><span class="nem">★</span>お気に入り</button>
  </div>
</nav>

/* ---------- build data tree + flat list ---------- */
const MAJORS = [];
const ITEMS = [];
(function(){
  let curMajor=null, curSection=null, id=0;
  for(const b of RAW){
    if(b.type==='major'){
      curMajor={name:b.text, idx:MAJORS.length, sections:[]};
      MAJORS.push(curMajor); curSection=null;
    }else if(b.type==='section'){
      curSection={name:b.text, idx:(curMajor?curMajor.sections.length:0), items:[]};
      if(curMajor) curMajor.sections.push(curSection);
    }else if(b.type==='item'){
      const it={id:id++, en:b.en, ja:b.ja,
        mIdx:curMajor?curMajor.idx:-1, sIdx:curSection?curSection.idx:-1,
        mName:curMajor?curMajor.name:'', sName:curSection?curSection.name:''};
      if(curSection) curSection.items.push(it);
      ITEMS.push(it);
    }
  }
})();
const BYID = {}; ITEMS.forEach(it=>BYID[it.id]=it);

document.getElementById('hcount').textContent = ITEMS.length + ' フレーズ';

/* ---------- favorites (persist if available) ---------- */
const FAV_KEY='eikaiwa_fav_v1';
let favs = new Set();
try{ const s=localStorage.getItem(FAV_KEY); if(s) favs=new Set(JSON.parse(s)); }catch(e){}
function saveFavs(){ try{ localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); }catch(e){} }
function toggleFav(id){ if(favs.has(id))favs.delete(id); else favs.add(id); saveFavs(); }

/* ---------- speech ---------- */
let enVoice=null;
function pickVoice(){
  const vs=window.speechSynthesis?window.speechSynthesis.getVoices():[];
  enVoice = vs.find(v=>/^en[-_]?US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if(window.speechSynthesis){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text, el){
  if(!window.speechSynthesis){ return; }
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=0.9; u.pitch=1;
  if(enVoice) u.voice=enVoice;
  if(el){ el.classList.add('speaking'); u.onend=u.onerror=()=>el.classList.remove('speaking'); }
  window.speechSynthesis.speak(u);
}

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function cardHTML(it){
  const on = favs.has(it.id)?' on':'';
  return '<div class="card" data-id="'+it.id+'">'
    + '<div class="en">'+esc(it.en)+'</div>'
    + '<div class="ja">'+esc(it.ja)+'</div>'
    + '<div class="tag">'+esc(it.sName)+'</div>'
    + '<div class="row">'
    +   '<button class="btn-ic speak" data-act="speak"><span class="em">🔊</span>発音</button>'
    +   '<button class="btn-ic fav'+on+'" data-act="fav"><span class="em">'+(on?'★':'☆')+'</span>保存</button>'
    + '</div></div>';
}
function bindCards(container){
  container.querySelectorAll('.card').forEach(card=>{
    const id=+card.dataset.id, it=BYID[id];
    card.querySelector('[data-act="speak"]').addEventListener('click',e=>{e.stopPropagation();speak(it.en,card);});
    card.querySelector('[data-act="fav"]').addEventListener('click',e=>{
      e.stopPropagation(); toggleFav(id);
      const b=e.currentTarget; const now=favs.has(id);
      b.classList.toggle('on',now); b.querySelector('.em').textContent=now?'★':'☆';
      if(currentTab==='fav') renderFav();
    });
  });
}

/* ---------- BROWSE ---------- */
let fMajor='all', fSub='all', query='';
const majorChips=document.getElementById('majorChips');
const subChips=document.getElementById('subChips');
const listEl=document.getElementById('list');
const browseCount=document.getElementById('browseCount');

function shortMajor(name){ // strip leading star/emoji + tidy
  return name.replace(/^[⭐★\s]+/,'').replace(/（.*?）/,'').trim();
}
function buildMajorChips(){
  let h='<button class="chip'+(fMajor==='all'?' on':'')+'" data-m="all">すべて</button>';
  MAJORS.forEach(m=>{
    h+='<button class="chip'+(fMajor===m.idx?' on':'')+'" data-m="'+m.idx+'">'+esc(shortMajor(m.name))+'</button>';
  });
  majorChips.innerHTML=h;
  majorChips.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
    fMajor = c.dataset.m==='all'?'all':+c.dataset.m; fSub='all';
    buildMajorChips(); buildSubChips(); renderBrowse();
  }));
}
function buildSubChips(){
  if(fMajor==='all'){ subChips.innerHTML=''; return; }
  const m=MAJORS[fMajor];
  let h='<button class="subchip'+(fSub==='all'?' on':'')+'" data-s="all">全カテゴリ</button>';
  m.sections.forEach(s=>{
    h+='<button class="subchip'+(fSub===s.idx?' on':'')+'" data-s="'+s.idx+'">'+esc(s.name.replace(/^[^\s]*\s*/,''))+'</button>';
  });
  subChips.innerHTML=h;
  subChips.querySelectorAll('.subchip').forEach(c=>c.addEventListener('click',()=>{
    fSub = c.dataset.s==='all'?'all':+c.dataset.s;
    buildSubChips(); renderBrowse();
  }));
}
function filteredItems(){
  const q=query.trim().toLowerCase();
  return ITEMS.filter(it=>{
    if(fMajor!=='all' && it.mIdx!==fMajor) return false;
    if(fSub!=='all' && it.sIdx!==fSub) return false;
    if(q && !(it.en.toLowerCase().includes(q) || it.ja.toLowerCase().includes(q))) return false;
    return true;
  });
}
function renderBrowse(){
  const items=filteredItems();
  browseCount.textContent = items.length+' 件';
  if(!items.length){
    listEl.innerHTML='<div class="empty"><span class="big">🔍</span>該当するフレーズがありません。<br>検索語やカテゴリを変えてみてください。</div>';
    return;
  }
  listEl.innerHTML=items.map(cardHTML).join('');
  bindCards(listEl);
}

const qInput=document.getElementById('q'), qClr=document.getElementById('qClr');
qInput.addEventListener('input',()=>{
  query=qInput.value; qClr.style.display=query?'block':'none'; renderBrowse();
});
qClr.addEventListener('click',()=>{ query=''; qInput.value=''; qClr.style.display='none'; renderBrowse(); qInput.focus(); });
document.getElementById('tipX').addEventListener('click',()=>{ document.getElementById('tip').style.display='none'; });

/* ---------- STUDY ---------- */
let dir='en', scope='all', deck=[], pos=0, revealed=false;
const scopeSel=document.getElementById('scopeSel');
const flash=document.getElementById('flash');
const qlabel=document.getElementById('qlabel');
const cardFront=document.getElementById('cardFront');
const cardBack=document.getElementById('cardBack');
const pbar=document.getElementById('pbar');
const pcount=document.getElementById('pcount');

function buildScopeOptions(){
  let h='<option value="all">すべて（'+ITEMS.length+'）</option>';
  h+='<option value="fav">★ お気に入り</option>';
  MAJORS.forEach(m=>{
    h+='<option value="m'+m.idx+'">'+esc(shortMajor(m.name))+'</option>';
    m.sections.forEach(s=>{
      h+='<option value="s'+m.idx+'_'+s.idx+'">　- '+esc(s.name.replace(/^[^\s]*\s*/,''))+'</option>';
    });
  });
  scopeSel.innerHTML=h;
}
function scopeItems(){
  if(scope==='all') return ITEMS.slice();
  if(scope==='fav') return ITEMS.filter(it=>favs.has(it.id));
  if(scope[0]==='m'){ const mi=+scope.slice(1); return ITEMS.filter(it=>it.mIdx===mi); }
  if(scope[0]==='s'){ const p=scope.slice(1).split('_'); const mi=+p[0],si=+p[1];
    return ITEMS.filter(it=>it.mIdx===mi && it.sIdx===si); }
  return ITEMS.slice();
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function loadDeck(doShuffle){
  deck=scopeItems(); if(doShuffle) shuffle(deck);
  pos=0; revealed=false; renderCard();
}
function renderCard(){
  if(!deck.length){
    qlabel.textContent='';
    cardFront.className='front';
    cardFront.innerHTML='<span style="font-size:16px;color:#9AA8B6;font-weight:400">このカテゴリにフレーズがありません</span>';
    cardBack.textContent='';
    flash.classList.remove('revealed'); flash.classList.add('no-card');
    pbar.style.width='0%'; pcount.textContent='0 / 0';
    return;
  }
  flash.classList.remove('no-card');
  const it=deck[pos];
  const frontJa = dir==='ja';
  qlabel.textContent = frontJa?'日本語':'ENGLISH';
  cardFront.textContent = frontJa?it.ja:it.en;
  cardFront.className = 'front'+(frontJa?' ja':'');
  cardBack.textContent = frontJa?it.en:it.ja;
  cardBack.className = 'back'+(frontJa?'':' ja');
  revealed=false; flash.classList.remove('revealed');
  pbar.style.width = ((pos+1)/deck.length*100)+'%';
  pcount.textContent=(pos+1)+' / '+deck.length;
}
flash.addEventListener('click',()=>{
  if(!deck.length) return;
  revealed=!revealed; flash.classList.toggle('revealed',revealed);
});
document.getElementById('dirSeg').querySelectorAll('button').forEach(b=>{
  b.addEventListener('click',()=>{
    dir=b.dataset.dir;
    document.getElementById('dirSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    renderCard();
  });
});
scopeSel.addEventListener('change',()=>{ scope=scopeSel.value; loadDeck(false); });
document.getElementById('shuffleBtn').addEventListener('click',()=>loadDeck(true));
document.getElementById('prevBtn').addEventListener('click',()=>{ if(!deck.length)return; pos=(pos-1+deck.length)%deck.length; renderCard(); });
document.getElementById('nextBtn').addEventListener('click',()=>{ if(!deck.length)return; pos=(pos+1)%deck.length; renderCard(); });
document.getElementById('studySpeak').addEventListener('click',()=>{ if(deck.length) speak(deck[pos].en, flash); });

/* ---------- FAVORITES ---------- */
const favListEl=document.getElementById('favList');
const favCountEl=document.getElementById('favCount');
function renderFav(){
  const items=ITEMS.filter(it=>favs.has(it.id));
  favCountEl.textContent=items.length+' 件保存中';
  if(!items.length){
    favListEl.innerHTML='<div class="empty"><span class="big">☆</span>お気に入りはまだありません。<br>一覧で「保存」をタップすると、<br>ここに集まります。</div>';
    return;
  }
  favListEl.innerHTML=items.map(cardHTML).join('');
  bindCards(favListEl);
}

/* ---------- tabs ---------- */
let currentTab='browse';
const views={browse:document.getElementById('view-browse'),study:document.getElementById('view-study'),fav:document.getElementById('view-fav')};
const navBtns=document.querySelectorAll('nav button');
function setTab(t){
  currentTab=t;
  for(const k in views) views[k].classList.toggle('hidden',k!==t);
  navBtns.forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  if(t==='fav') renderFav();
  if(t==='study' && !deck.length) loadDeck(false);
  window.scrollTo(0,0);
}
navBtns.forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));

/* ---------- init ---------- */
buildMajorChips(); buildSubChips(); renderBrowse();
buildScopeOptions(); loadDeck(false);
</script>
